name: Deploy

# Solo se despliega cuando el workflow CI (que incluye el Security Gate)
# termina con exito sobre la rama main.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push de la imagen
        env:
          IMAGE_RAW: ${{ github.repository }}
        run: |
          IMAGE=$(echo "${IMAGE_RAW}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${IMAGE}/shop-api:latest .
          docker push ghcr.io/${IMAGE}/shop-api:latest
      - name: Smoke test del contenedor
        env:
          IMAGE_RAW: ${{ github.repository }}
        run: |
          IMAGE=$(echo "${IMAGE_RAW}" | tr '[:upper:]' '[:lower:]')
          docker run -d --name shop -p 8000:8000 ghcr.io/${IMAGE}/shop-api:latest
          sleep 6
          curl -fsS http://localhost:8000/health
          docker rm -f shop
