name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests
        run: pytest tests -v

  snyk-oss:
    name: Snyk Open Source (SCA)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar Snyk CLI
        run: npm install -g snyk
      - name: Instalar dependencias (arbol SCA)
        run: pip install -r requirements.txt
      - name: Escaneo de dependencias (todas las severidades)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt
          rc=$?
          if [ $rc -eq 1 ]; then
            echo "::warning::Snyk Open Source encontro vulnerabilidades. La decision de bloqueo la toma el job Security Gate."
            exit 0
          fi
          exit $rc
      - name: Monitor (registro continuo en Snyk)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --file=requirements.txt

  snyk-code:
    name: Snyk Code (SAST)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Snyk CLI
        run: npm install -g snyk
      - name: Escaneo estatico de codigo (todas las severidades)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test
          rc=$?
          if [ $rc -eq 1 ]; then
            echo "::warning::Snyk Code encontro hallazgos. La decision de bloqueo la toma el job Security Gate."
            exit 0
          fi
          exit $rc

  security-gate:
    name: Security Gate (policy)
    needs: [snyk-oss, snyk-code]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar Snyk CLI
        run: npm install -g snyk
      - name: Instalar dependencias (arbol SCA)
        run: pip install -r requirements.txt
      - name: Capturar resultados de Snyk (todas las severidades)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt --json > snyk-oss.json || true
          snyk code test --json > snyk-code.json || true
      - name: Aplicar Security Gate
        run: python scripts/security_gate.py snyk-oss.json snyk-code.json security-gate-report.md
      - name: Comentar resumen del gate en el PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('security-gate-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  docker-build:
    name: Build imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t shop-api:ci .
