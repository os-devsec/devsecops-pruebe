<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Shop - Catalog</title>
</head>
<body>
    <h1>Product Catalog</h1>
    <ul>
        {% for p in products %}
        <li>{{ p["name"] }} - ${{ p["price"] }} ({{ p["category"] }})</li>
        {% endfor %}
    </ul>
</body>
</html>
